name: Deploy Cloudflare Worker

# Runs on every push to main so the cron trigger and worker code
# stay in sync with the repo without a manual `wrangler deploy`.
on:
  push:
    branches: [main]
    paths:
      # Only rebuild when Worker-related files change.
      # A server-only commit does not need a new CF deploy.
      - "client/**"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build Vite bundle
        working-directory: client
        run: npm run build

      - name: Deploy Worker (with cron triggers)
        working-directory: client
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
