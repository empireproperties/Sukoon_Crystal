name: Keep Render Backend Warm

# External heartbeat every 5 minutes so Render's free-tier ~15-minute
# inactivity hibernation cannot shut down the API between real visitors.
# Internal self-pings from inside the container do not count as external
# traffic on Render, and Cloudflare Worker crons require CLOUDFLARE_API_TOKEN.
# This workflow needs zero secrets and runs as an external client.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive-ping
  cancel-in-progress: true

jobs:
  ping:
    name: Wake / Keep-Alive Render API
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Render /api/health (with cold-start retry)
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (compatible; SukoonKeepAlive/1.0; +https://sukoon-crystalsolutions.com)"
          for attempt in 1 2 3 4; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
              --max-time 35 \
              -A "$UA" \
              -H "Accept: application/json" \
              "https://sukoon-crystal.onrender.com/api/health" || echo "000")
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              echo ""
              exit 0
            fi
            sleep 10
          done
          echo "Health ping failed after retries (last HTTP $code)"
          exit 1
